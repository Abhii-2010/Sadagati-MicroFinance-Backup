services:
  postgres:
    image: postgres:17
    container_name: sadagati-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sadagati_mf
      POSTGRES_USER: sadagati
      POSTGRES_PASSWORD: sadagati_dev_password
    ports:
      - "5432:5432"
    volumes:
      - sadagati_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadagati -d sadagati_mf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sadagati-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sadagati_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sadagati-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://sadagati:sadagati_dev_password@postgres:5432/sadagati_mf?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sadagati_postgres_data:
  sadagati_redis_data: